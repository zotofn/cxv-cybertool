<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CXV CyberPanel</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: #050008;
    color: white;
    font-family: monospace;
    display: flex;
    justify-content: center;
    align-items: center;
}

.panel {
    width: 90%;
    max-width: 1100px;
    min-height: 650px;
    padding: 35px;
    border: 2px solid #a000ff;
    border-radius: 20px;
    background: #100018;
    box-shadow: 0 0 15px #a000ff, 0 0 40px #7200aa;
}

h1 {
    text-align: center;
    font-size: 42px;
    color: #d45cff;
    text-shadow: 0 0 15px #a000ff;
}

.section {
    margin-top: 30px;
}

.section h2 {
    color: #b52cff;
    border-bottom: 1px solid #6d0099;
    padding-bottom: 8px;
}

button {
    margin: 7px;
    padding: 15px 25px;
    background: #160020;
    color: #d45cff;
    border: 1px solid #a000ff;
    border-radius: 10px;
    font-family: monospace;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #260038;
    box-shadow: 0 0 20px #c000ff;
}

#output {
    margin-top: 30px;
    padding: 20px;
    min-height: 80px;
    border: 1px solid #6d0099;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="panel">

<h1>CXV CYBERPANEL</h1>

<div class="section">
<h2>NETWORK</h2>

<button onclick="showIP()">MY IP</button>
<button onclick="showTime()">TIME</button>
<button onclick="showDate()">DATE</button>
</div>

<div class="section">
<h2>SYSTEM</h2>

<button onclick="showBrowser()">BROWSER</button>
<button onclick="showScreen()">SCREEN</button>
</div>

<div class="section">
<h2>TOOLS</h2>

<button onclick="randomNumber()">RANDOM NUMBER</button>
<button onclick="randomID()">RANDOM ID</button>
<button onclick="clearOutput()">CLEAR</button>
</div>

<div id="output">
CXV SYSTEM READY...
</div>

</div>

<script>

function showIP() {
    document.getElementById("output").textContent =
    "IP lookup requires a server.";
}

function showTime() {
    document.getElementById("output").textContent =
    new Date().toLocaleTimeString();
}

function showDate() {
    document.getElementById("output").textContent =
    new Date().toLocaleDateString();
}

function showBrowser() {
    document.getElementById("output").textContent =
    navigator.userAgent;
}

function showScreen() {
    document.getElementById("output").textContent =
    screen.width + " × " + screen.height;
}

function randomNumber() {
    document.getElementById("output").textContent =
    Math.floor(Math.random() * 1000000);
}

function randomID() {
    document.getElementById("output").textContent =
    crypto.randomUUID();
}

function clearOutput() {
    document.getElementById("output").textContent =
    "CXV SYSTEM READY...";
}

</script>

</body>
</html>
