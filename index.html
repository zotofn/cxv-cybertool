<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CXV CyberPanel</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: #050008;
    color: white;
    font-family: monospace;
    display: flex;
    justify-content: center;
    align-items: center;
}

.panel {
    width: 90%;
    max-width: 1000px;
    padding: 40px;
    background: #100018;
    border: 2px solid #a000ff;
    border-radius: 20px;
    box-shadow: 0 0 30px #a000ff;
    text-align: center;
}

h1 {
    font-size: 45px;
    color: #d45cff;
    text-shadow: 0 0 20px #a000ff;
}

button {
    padding: 18px 30px;
    margin: 10px;
    background: #180020;
    color: #d45cff;
    border: 2px solid #a000ff;
    border-radius: 10px;
    font-family: monospace;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    box-shadow: 0 0 20px #d000ff;
}

#output {
    margin-top: 30px;
    padding: 20px;
    border: 1px solid #a000ff;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="panel">

<h1>CXV CYBERPANEL</h1>

<button onclick="giveConsent()">
I AGREE — SHOW MY IP
</button>

<button onclick="showTime()">
TIME
</button>

<button onclick="showDate()">
DATE
</button>

<div id="output">
CXV SYSTEM READY...
</div>

</div>

<script>

async function giveConsent() {

    const output = document.getElementById("output");

    output.textContent = "Connecting to CXV backend...";

    try {

        const response = await fetch(
            "http://192.168.0.126:3000/consent",
            {
                method: "POST"
            }
        );

        const data = await response.json();

        output.textContent =
            "Your IP: " + data.ip;

    } catch (error) {

        output.textContent =
            "Could not connect to CXV backend.";

    }
}

function showTime() {
    document.getElementById("output").textContent =
        new Date().toLocaleTimeString();
}

function showDate() {
    document.getElementById("output").textContent =
        new Date().toLocaleDateString();
}

</script>

</body>
</html>
